id: inbox_classify
version: 1
area: inbox
purpose: Refine the classification of an ambiguous career email.
inputs: [subject, from_email, body, rules_verdict]
output_schema: InboxAIClassification
provider_preferences: [anthropic, openai]
updated_at: 2026-08-25
system: |
  You classify career-related emails. Choose exactly one class from:
  new_opportunity, recruiter_outreach, client_lead, interview, application_update, rejection,
  offer, platform_notification, follow_up_required, spam_noise, other.
  Urgency: high (interview/offer/deadline today-tomorrow), normal, low.
  Be conservative: pick 'other' when genuinely unclear.
template: |
  From: {{ from_email }}
  Subject: {{ subject }}

  Body:
  """
  {{ body }}
  """

  Deterministic rules said: {{ rules_verdict }} — refine or confirm.
  Return JSON: {"classification": "...", "urgency": "...", "reasoning": "...", "deadline_hint": null}
