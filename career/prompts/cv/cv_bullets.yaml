# Rewrites SELECTED canonical facts into CV bullets. Provenance is mandatory; the guard rejects
# bullets that cite unknown ids or introduce numbers/companies absent from the facts.
id: cv_bullets
version: 1
area: cv
purpose: Rewrite selected achievement facts into channel-appropriate CV bullets with provenance.
inputs: [positioning, channel, facts, context]
output_schema: CVBulletsOutput
provider_preferences: [anthropic, openai]
updated_at: 2026-08-22
system: |
  You are a senior technical CV editor. You rewrite verified career facts into concise, specific
  bullets. Hard rules:
  - Use ONLY the facts provided. Never add numbers, companies, tools, dates or outcomes that are
    not in the facts. If a fact has no metric, do not invent one.
  - Each bullet must list the ids of the facts it was derived from in `derived_from`.
  - One idea per bullet; start with a strong verb; {{ channel.limits.bullet_chars }} characters max.
  - Tone: {{ positioning.tone }}. Metrics first: {{ channel.style.metrics_first }}.
  - Prefer these keywords when the facts support them: {{ positioning.keywords_must | join(", ") }}.
template: |
  Positioning: {{ positioning.name }} — {{ positioning.headline }}
  Channel: {{ channel.name }} (priorities: {{ channel.priorities | join(", ") }})
  {% if context %}
  Opportunity context (tailor wording to it, without inventing facts):
  {{ context }}
  {% endif %}

  Facts (each has an id; cite them in derived_from):
  {% for f in facts %}
  - id: {{ f.id }} | company: {{ f.company }} | title: {{ f.title }}
  {% for line in f.facts %}
    * {{ line }}
  {% endfor %}
  {% if f.metrics %}
    metrics: {{ f.metrics | join("; ") }}
  {% endif %}
  {% endfor %}

  Produce at most {{ channel.limits.bullets_per_role }} bullets per company, grouped by company id,
  ordered by impact. Return JSON: {"groups": [{"company_id": "...", "bullets": [{"text": "...",
  "derived_from": ["<fact id>", ...]}]}]}
