      - Reduced failed production deploys from roughly 3 per month to under 1 per quarter
    metrics:
      - name: MR pipeline time (median)
        value: "9"
        unit: minutes
        baseline: "34"
      - name: Failed production deploys
        value: "<1 per quarter"
        baseline: "~3 per month"
    technologies:
      first_priority: [dbt, Dagster, GitLab CI, ClickHouse, Docker]
      additional: [Python, Bash]
      target: []
    keywords: [CI/CD, Slim CI, dbt, Dagster, GitLab, deployment reliability, DataOps]
    evidence:
