items:
  - id: proj_pdp_ci
    status: verified
    name: Analytics platform CI/CD (dbt + Dagster + GitLab)
    kind: work
    company_id: northwind_commerce
    summary: GitLab CI/CD for a dbt + Dagster analytics platform with Slim CI, environment validation and gated deploys.
    problem: Long pipelines and frequent broken deploys blocked the data team; no safe path to production.
    solution: State-based dbt Slim CI, per-environment validation jobs, resource-group deploy queue, rollback recipe.
    outcome: Pipelines 34 → 9 min; failed prod deploys from ~3/month to <1/quarter.
    technologies: [GitLab CI, dbt, Dagster, Docker, Python]
    period: 2023-2024
    public: false
    updated_at: 2026-07-15

  - id: proj_clickhouse_realtime
    status: verified
    name: ClickHouse real-time event analytics
    kind: work
    company_id: northwind_commerce
    summary: Migration of event analytics from PostgreSQL to ClickHouse with a dbt modelling layer and Metabase dashboards.
    problem: 12-second dashboards and an expensive read-replica fleet.
    solution: MergeTree schemas, materialised views, dbt-clickhouse models, Dagster-scheduled loads.
    outcome: p95 latency under 600 ms; infra cost -45%.
    technologies: [ClickHouse, dbt, Dagster, Metabase, PostgreSQL]
    period: 2024
    public: false
    updated_at: 2026-07-15

