# CareerOS — project overlay for the deploy-app driver.
# Read by ~/.ai/skills/_scripts/deploy/deploy-app.sh; overlays the platform profile
# at ~/.ai/templates/profiles/<platform>.yml. Contains NO secret values, ever.

name: careeros
region: ams

# Allow-list, deliberately. Without `include`, the driver pushes every variable it
# finds in config/.env.* minus a small built-in exclude list — which on this machine
# would ship unrelated credentials to the platform. Only CAREEROS_* may leave.
env_push:
  include:
    - "CAREEROS_*"
  exclude:
    # Local-only: these point at the dev docker-compose, never at the deployed stack.
    - CAREEROS_TEST_DATABASE_URL
    - CAREEROS_REDIS_URL
    # Injected by the platform itself (`fly mpg attach --variable-name`), so pushing
    # a local value would overwrite the real one with a localhost DSN.
    - CAREEROS_DATABASE_URL
    # Platform-connector credentials. Sync is LOCAL-ONLY (the owner runs `just platform-*`
    # on the workstation), so the deployed app never uses these — shipping OAuth client
    # secrets and refresh tokens to a host that cannot use them is exposure for nothing.
    # The allow-list above would otherwise admit them automatically, since they are all
    # CAREEROS_-prefixed. Re-admit them only when platform sync actually runs on Fly,
    # which also needs a volume for the token file (GH #21).
    - "CAREEROS_HH_*"
    - "CAREEROS_UPWORK_*"
    - "CAREEROS_PLATFORM_*"
