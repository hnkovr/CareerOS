name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: careeros
          POSTGRES_PASSWORD: careeros
          POSTGRES_DB: careeros_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careeros" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      CAREEROS_TEST_DATABASE_URL: postgresql+asyncpg://careeros:careeros@localhost:5432/careeros_test
      CAREEROS_DATABASE_URL: postgresql+asyncpg://careeros:careeros@localhost:5432/careeros_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --all-groups --frozen
      # keep in step with the `lint` recipe in the Justfile (`make lint` runs the same set)
      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run lint-imports
          python3 scripts/env-render.py --check
      # contract freshness needs node too — see the `contracts` job below
      - name: validate demo vault
        run: uv run careeros vault validate --path career/examples/demo
      - name: migrate
        run: uv run alembic -c services/careeros/alembic.ini upgrade head
      - name: test
        run: uv run pytest

  # Both generators must run, or "fresh" means "fresh in the half we could check".
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv python install 3.13
      - run: uv sync --all-groups --frozen
      - run: npm ci
      - name: generated contracts match the code
        run: scripts/contracts-check.sh

  web:
    runs-on: ubuntu-latest
    # (no job-level hashFiles() guard: that function is step-only and makes GitHub reject the file)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run -w apps/web lint
      - run: npm run -w apps/web typecheck
      - run: npm run -w apps/web test --if-present
      - run: npm run -w apps/web build

  docker:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.careeros
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
