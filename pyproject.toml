[tool.uv.workspace]
members = ["services/careeros"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "T20"]
ignore = ["RUF012", "B008"]
allowed-confusables = ["–", "—", "’", "“", "”", "≥", "≈", "·"]

[tool.ruff.lint.per-file-ignores]
"**/cli.py" = ["T20"]
"**/seed.py" = ["T20"]
"**/tests/**" = ["T20", "ASYNC"]
"scripts/**" = ["T20"]
# platform connectors parse Russian page text: Cyrillic literals are intentional
"**/modules/platform/**" = ["RUF001", "RUF002", "RUF003"]
"**/tests/platform/**" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["careeros"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["services/careeros/src", "services/careeros/tests"]
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["services/careeros/tests", "tests"]
pythonpath = ["services/careeros"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q -ra"
markers = ["db: requires a reachable PostgreSQL (CAREEROS_TEST_DATABASE_URL)", "ai: calls a real AI provider (skipped unless CAREEROS_AI_LIVE=1)", "live: reads real job sites (skipped unless CAREEROS_LIVE_TESTS=1)"]
filterwarnings = ["error::DeprecationWarning:careeros.*"]

[tool.importlinter]
root_package = "careeros"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "AI SDKs and provider adapters are used only through the AI gateway"
type = "forbidden"
source_modules = [
  "careeros.api", "careeros.core", "careeros.modules.vault", "careeros.modules.cv",
  "careeros.modules.opportunities",
  "careeros.modules.ai.service", "careeros.modules.ai.prompts", "careeros.modules.ai.provider",
]
forbidden_modules = ["anthropic", "openai", "careeros.modules.ai.providers"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "vault does not depend on the database or other modules"
type = "forbidden"
source_modules = ["careeros.modules.vault"]
forbidden_modules = ["sqlalchemy", "careeros.core.db", "careeros.core.models", "careeros.modules.ai", "careeros.modules.cv"]

[[tool.importlinter.contracts]]
name = "rendercv is used only by the CV adapter"
type = "forbidden"
source_modules = ["careeros.api", "careeros.core", "careeros.modules.vault", "careeros.modules.ai", "careeros.modules.cv.service", "careeros.modules.cv.builder"]
forbidden_modules = ["rendercv"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "platform connectors are pure I/O + mapping (ADR-004): no DB, no domain services"
type = "forbidden"
# The job-read layer (ADR-015: ``fetch``, ``sources``) is held to the same purity as the
# connectors that use it. Transitive edges count, so it cannot reach ``opportunities.parser``
# (→ ``cv.keywords``) either — text heuristics run at ingest, not here.
source_modules = [
  "careeros.modules.platform.connectors",
  "careeros.modules.platform.fetch",
  "careeros.modules.platform.sources",
]
forbidden_modules = [
  "sqlalchemy", "careeros.core.db", "careeros.core.models",
  "careeros.modules.platform.service", "careeros.modules.platform.sync", "careeros.modules.platform.models",
  "careeros.modules.platform.router", "careeros.modules.platform.cli",
  "careeros.modules.profiles.service", "careeros.modules.profiles.models",
  "careeros.modules.opportunities.service", "careeros.modules.opportunities.models",
  "careeros.modules.opportunities.parser",
  "careeros.modules.ai", "careeros.modules.cv",
]

[[tool.importlinter.contracts]]
name = "bot reaches other modules only through their service layer (invariant 7)"
type = "forbidden"
source_modules = ["careeros.modules.bot"]
forbidden_modules = [
  "careeros.modules.ai.models", "careeros.modules.cv.models",
  "careeros.modules.inbox.models", "careeros.modules.opportunities.models",
  "careeros.modules.pipeline.models", "careeros.modules.platform.models",
  "careeros.modules.profiles.models",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "insights reads other modules only through their service layer (invariant 7)"
type = "forbidden"
source_modules = ["careeros.modules.insights"]
forbidden_modules = [
  "careeros.modules.ai.models", "careeros.modules.ai.suggestions",
  "careeros.modules.inbox.models", "careeros.modules.opportunities.models",
  "careeros.modules.pipeline.models", "careeros.modules.profiles.models",
  "careeros.modules.profiles.drift", "careeros.modules.cv.models", "careeros.modules.platform.models",
]
allow_indirect_imports = true
