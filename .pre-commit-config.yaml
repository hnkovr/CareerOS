repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(career/.*|docker-compose\.yml)$
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: env-template-check
        name: env templates carry no secret literals
        entry: python3 scripts/env-render.py --check
        language: system
        pass_filenames: false
        files: ^config/\.env.*\.template$
      - id: vault-validate
        name: validate demo vault
        entry: uv run careeros vault validate --path career/examples/demo
        language: system
        pass_filenames: false
        files: ^(career/examples/demo/.*|services/careeros/src/careeros/modules/vault/.*)$
